[package]
org = "embedded-alerts"
name = "eal-api-server"
version = "0.1.0"
description = "Rust API server for Embedded Alerts"
license = "MIT"
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/embedded-alerts/eal-api-server.rs"

[install]
dir = ".vendor/.zed"

[dependencies]
"embedded-alerts/eal-lib-core" = "^0.1.0"
"embedded-alerts/eal-orm-core" = "^0.1.0"
"shared-auth/shared-auth-clients" = "^0.1.0"
"oresoftware/next-loggers" = "^0.1.0"

[build]
command = "cargo build --release --locked"
outputs = ["target/release/eal-api-server"]

[targets.rust]
dir = "."
adapter = "rust"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", "node_modules/**", "target/**", "dist/**", "*.log", ".vendor/.zed/**"]